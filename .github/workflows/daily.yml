name: daily

on:
  schedule:
    # Backup only: the PC task normally triggers this. GitHub starts
    # scheduled runs ~6 hours late; whichever run comes first each IST day
    # pushes a file and the rest skip.
    - cron: "0 7 * * *"   # 12:30 PM IST
    - cron: "0 10 * * *"  # 3:30 PM IST
  workflow_dispatch:
    inputs:
      force:
        description: "Push even if a file was already pushed today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the oldest queued file to the repo root
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git config user.name "dev-ghosh"
          git config user.email "175207023+dev-ghosh@users.noreply.github.com"

          if [ "${FORCE:-false}" != "true" ]; then
            today=$(TZ=Asia/Kolkata date +%Y-%m-%d)
            if git log --since="$today 00:00 +0530" --diff-filter=D --name-only --format= -- queue | grep -q .; then
              echo "already pushed a file today"
              exit 0
            fi
          fi

          f=$(find queue -maxdepth 1 -name '*.md' | sort | head -n 1)
          if [ -z "$f" ]; then
            echo "queue is empty"
            exit 0
          fi
          name=$(basename "$f")
          if [ -e "$name" ]; then verb=Update; else verb=Add; fi
          mv -f "$f" "$name"
          git add -A -- "$f" "$name"
          git commit -m "$verb $name"
          git pull --rebase
          git push
